name: Feature request
description: Suggest a new backend, hotkey behaviour, or quality-of-life improvement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the friction or missing capability in your current workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should STT-Go do? Be concrete — UI flow, config field, hotkey, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or different shapes of the same feature.
  - type: markdown
    attributes:
      value: |
        Reminder — STT-Go is Windows-only by design. macOS / Linux ports are out of scope (see CONTRIBUTING.md). Feature requests that assume cross-platform support will be closed.
