name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # unsafeptr is disabled: every flagged conversion is a Win32 syscall
      # return (uintptr by ABI, real OS-side memory address). golang.org/x/sys/windows
      # does the same internally. Re-enable if we ever touch Go-heap pointers via uintptr.
      - run: go vet -unsafeptr=false ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go build ./...
      - run: go test ./... -race
