ShortDescription: Windows hotkey-to-dictation tool with Whisper, Deepgram, ElevenLabs, and Groq backends.
Description: |-
  STT-Go is a Windows-only dictation tool. Hold Right-Alt, speak, release — the transcript is typed into the focused window.
  Runs a streaming backend and a REST backend in parallel and uses whichever finishes first, so you get streaming-speed latency with REST-grade accuracy as a fallback.
  Six backends supported: OpenAI Whisper (REST + SSE + Realtime WebSocket), Deepgram Nova-3, ElevenLabs Scribe (streaming + batch), and Groq Whisper.
  System tray, configurable hotkey, keyterm hinting, regex replacements, clipboard image passthrough.
